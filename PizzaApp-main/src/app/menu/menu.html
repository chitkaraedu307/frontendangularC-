<div class="container">
  <div class="menu-header">
    <h1 class="menu-title">🍕 Our Delicious Menu</h1>
    <p class="menu-subtitle">Choose from our wide selection of freshly baked pizzas</p>
  </div>

  <style>
    .container {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .menu-header {
      text-align: center;
      margin-bottom: 40px;
      color: white;
    }

    .menu-title {
      font-size: 3rem;
      font-weight: 700;
      margin: 0;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
      animation: fadeInDown 0.8s ease;
    }

    .menu-subtitle {
      font-size: 1.2rem;
      margin-top: 10px;
      opacity: 0.9;
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translateY(-30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .menu-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 30px;
      justify-items: center;
      margin: 0 auto;
      max-width: 1200px;
    }

    .pizza-card {
      background: linear-gradient(145deg, #ffffff 0%, #f8f9fa 100%);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 300px;
      text-align: center;
      transition: all 0.4s ease;
      padding: 20px;
      position: relative;
      overflow: hidden;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .pizza-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 87, 34, 0.1) 0%, rgba(255, 193, 7, 0.1) 100%);
      opacity: 0;
      transition: opacity 0.4s ease;
      z-index: 0;
    }

    .pizza-card:hover::before {
      opacity: 1;
    }

    .pizza-card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
    }

    .pizza-card > * {
      position: relative;
      z-index: 1;
    }

    .pizza-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
      transition: transform 0.4s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .pizza-card:hover img {
      transform: scale(1.1) rotate(2deg);
    }

    .pizza-card h3 {
      margin: 15px 0 10px;
      font-size: 1.5rem;
      font-weight: 700;
      color: #2c3e50;
      letter-spacing: 0.5px;
    }

    .pizza-card p {
      font-size: 0.9rem;
      color: #666;
      margin: 10px 0;
      line-height: 1.5;
      min-height: 40px;
    }

    .price {
      font-weight: 800;
      font-size: 1.8rem;
      color: #27ae60;
      margin: 15px 0;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .price::before {
      content: '💰';
      font-size: 1.2rem;
    }

    .order-btn {
      background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
      color: white;
      border: none;
      border-radius: 25px;
      padding: 12px 30px;
      margin-top: 15px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
    }

    .order-btn:hover {
      background: linear-gradient(135deg, #ee5a6f 0%, #ff6b6b 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
    }

    .order-btn:active {
      transform: translateY(0);
    }

    @media (max-width: 768px) {
      .menu-title {
        font-size: 2rem;
      }

      .menu-subtitle {
        font-size: 1rem;
      }

      .menu-container {
        grid-template-columns: 1fr;
        gap: 20px;
      }
    }
  </style>

  <div class="menu-container">
    <div class="pizza-card" *ngFor="let item of pizza">
      <img src="https://localhost:7123/{{item.pimage}}" alt="{{ item.pizzaname }}">
      <h3>{{ item.pizzaname | uppercase }}</h3>
      <p>{{ item.description }}</p>
      <p class="price"><s>₹{{ item.price }}</s> ₹{{ item.price | discount:30}}</p>
      
      <button class="order-btn" routerLink="/cart" [queryParams]="{a:item.pizzaid,b:item.pizzaname,c:item.pimage,d:item.description,e:item.price | discount:20 |number }">Order Now</button>
    </div>
  </div>
</div>
